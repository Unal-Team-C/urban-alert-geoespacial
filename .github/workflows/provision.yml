# Provisioning (spec 002, RF-012): every push to main tests, provisions and deploys.
# Order (plan Revisión v2, D-025): tests → platform check → base → image → schema → service → listener → routes → smoke.
# The service runs in the private network of the shared platform (Unal-Team-C/urban-alert-plataforma) and is
# reachable only through its API Gateway.
name: Provision

on:
  push:
    branches: [main]

# Shared with deprovision.yml: runs touching the same infrastructure queue up instead of overlapping (RF-015).
concurrency:
  group: urban-alert-geoespacial-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit and integration tests (PostGIS in compose)
        run: docker compose --profile test run --rm --build tests

      - name: Script tests
        run: bash scripts/tests/test-check-platform.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      - name: Terraform validate and test (mocked providers)
        run: |
          for stack in base service routes; do
            terraform -chdir="infra/$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$stack" validate
            terraform -chdir="infra/$stack" test
          done

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.7 -color

  provision:
    name: Provision and deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: temporary AWS credentials, no stored keys (RF-014)
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check the shared platform is provisioned (nothing is changed before this)
        run: scripts/check-platform.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Apply base (ECR, roles, security groups, RDS, secret, logs, schema task)
        run: |
          terraform -chdir=infra/base init -input=false
          terraform -chdir=infra/base apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG"

      - name: Read base outputs
        id: base
        run: |
          out() { terraform -chdir=infra/base output -raw "$1"; }
          {
            echo "name=$(out name)"
            echo "ecr_url=$(out ecr_repository_url)"
            echo "cluster=$(out cluster_name)"
            echo "schema_task=$(out schema_task_definition_arn)"
            echo "schema_container=$(out schema_container_name)"
            echo "schema_log_group=$(out schema_log_group)"
            echo "tasks_sg=$(out tasks_security_group_id)"
            echo "subnets=$(terraform -chdir=infra/base output -json subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tag = commit SHA)
        env:
          REPOSITORY: ${{ steps.base.outputs.name }}
          IMAGE: ${{ steps.base.outputs.ecr_url }}:${{ env.IMAGE_TAG }}
        run: |
          # Tags are immutable: a re-run of the same commit reuses the image already pushed.
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists, skipping build."
          else
            docker build --platform linux/amd64 --target runtime -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Apply database schema (one-off ECS task in the private subnets)
        env:
          CLUSTER: ${{ steps.base.outputs.cluster }}
          TASK_DEFINITION: ${{ steps.base.outputs.schema_task }}
          SUBNETS: ${{ steps.base.outputs.subnets }}
          SECURITY_GROUP: ${{ steps.base.outputs.tasks_sg }}
          LOG_GROUP: ${{ steps.base.outputs.schema_log_group }}
          CONTAINER: ${{ steps.base.outputs.schema_container }}
        run: scripts/run-schema-task.sh

      - name: Apply service (ECS Express Mode, internal load balancer)
        id: service
        run: |
          terraform -chdir=infra/service init -input=false
          terraform -chdir=infra/service apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG"
          {
            echo "endpoint=$(terraform -chdir=infra/service output -raw service_endpoint)"
            echo "cluster=$(terraform -chdir=infra/service output -raw cluster_name)"
            echo "name=$(terraform -chdir=infra/service output -raw service_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Diagnose the service deployment (only when it failed)
        if: failure() && steps.base.outcome == 'success'
        env:
          CLUSTER: ${{ steps.base.outputs.cluster }}
          SERVICE: ${{ steps.base.outputs.name }}
        run: scripts/diagnose-service.sh "$CLUSTER" "$SERVICE" "/ecs/$SERVICE"

      - name: Find the 443 listener of the Express load balancer
        id: listener
        env:
          CLUSTER: ${{ steps.service.outputs.cluster }}
          SERVICE: ${{ steps.service.outputs.name }}
        run: echo "arn=$(scripts/buscar-listener-express.sh "$CLUSTER" "$SERVICE")" >> "$GITHUB_OUTPUT"

      - name: Apply routes in the shared API Gateway
        id: routes
        env:
          ENDPOINT: ${{ steps.service.outputs.endpoint }}
          LISTENER: ${{ steps.listener.outputs.arn }}
        run: |
          terraform -chdir=infra/routes init -input=false
          terraform -chdir=infra/routes apply -input=false -auto-approve \
            -var "express_endpoint=$ENDPOINT" -var "express_listener_arn=$LISTENER"
          echo "gateway=$(terraform -chdir=infra/routes output -raw gateway_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test through the gateway
        env:
          GATEWAY: ${{ steps.routes.outputs.gateway }}
        run: scripts/smoke-gateway-geoespacial.sh "$GATEWAY"

      - name: Summary
        if: always()
        env:
          GATEWAY: ${{ steps.routes.outputs.gateway }}
        run: |
          {
            echo "### Servicio Geoespacial"
            echo "- Commit: \`$IMAGE_TAG\`"
            if [ -n "$GATEWAY" ]; then
              echo "- Público: \`GET $GATEWAY/api/v1/geoespacial/reports\`, \`GET $GATEWAY/api/v1/geoespacial/coordinates/{id}\`"
              echo "- Interno (firma IAM): \`POST $GATEWAY/api/v1/geoespacial/coordinates\`"
            else
              echo "- Rutas del gateway: (no disponibles)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
